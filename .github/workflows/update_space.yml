name: Run Python script

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Hugging Face Hub
      run: python -m pip install huggingface_hub

    - name: Deploy to Spaces
      env:
        HF_TOKEN: ${{ secrets.hf_token }}
      run: |
        python - << 'PY'
        import os
        import sys
        from huggingface_hub import HfApi

        token = os.environ.get("HF_TOKEN")
        if not token:
            sys.exit("GitHub Actions secret 'hf_token' is missing. Add a Hugging Face token that can write to the Space.")

        space_id = "manju0707/manjunath-career-conversation"
        api = HfApi(token=token)
        who = api.whoami()
        print(f"Authenticated as {who.get('name')}")
        api.create_repo(space_id, repo_type="space", space_sdk="gradio", exist_ok=True)
        api.upload_folder(
            repo_id=space_id,
            repo_type="space",
            folder_path=".",
            commit_message="Deploy from GitHub Actions",
            ignore_patterns=[".git/*", ".venv/*", ".env", "**/.env"],
        )
        print(f"Space available at https://huggingface.co/spaces/{space_id}")
        PY
